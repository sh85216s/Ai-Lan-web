<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柱體與錐體的立體世界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 450px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-shapes text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-100 tracking-wide">立體幾合大探索</h1>
                    <p class="text-xs text-slate-400">柱體與錐體的互動視界</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span
                    class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    <span class="w-2 h-2 mr-1.5 rounded-full bg-indigo-400 animate-pulse"></span> 互動教學模式
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Sidebar: Shape Selector & Info Panel -->
            <div class="lg:col-span-4 space-y-6">
                <div
                    class="bg-slate-800/60 backdrop-blur border border-slate-700/60 p-2 rounded-2xl flex space-x-2 shadow-xl">
                    <button id="tab-prism" onclick="switchCategory('prism')"
                        class="flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-cubes"></i>
                        <span>柱體專區</span>
                    </button>
                    <button id="tab-pyramid" onclick="switchCategory('pyramid')"
                        class="flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-700/50">
                        <i class="fa-solid fa-mountain"></i>
                        <span>錐體專區</span>
                    </button>
                </div>

                <div
                    class="bg-slate-800/60 backdrop-blur border border-slate-700/60 p-5 rounded-2xl shadow-xl space-y-4">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">選擇形體</h3>
                    <div id="shape-buttons-grid" class="grid grid-cols-2 gap-3">
                    </div>
                </div>

                <div
                    class="bg-slate-800/60 backdrop-blur border border-slate-700/60 p-6 rounded-2xl shadow-xl space-y-5">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                        <h3 id="current-shape-title" class="font-bold text-lg text-indigo-300">三角柱</h3>
                        <span id="shape-category-badge"
                            class="px-2.5 py-1 rounded-md text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">柱體</span>
                    </div>

                    <p id="current-shape-desc" class="text-sm text-slate-300 leading-relaxed">
                        上下底面為全等的三角形，側面為長方形，共有 3 個側面。
                    </p>

                    <div class="grid grid-cols-3 gap-3 text-center">
                        <div class="bg-slate-900/60 border border-slate-700/80 p-3 rounded-xl">
                            <div class="text-xs text-slate-400 mb-1 font-medium">頂點數</div>
                            <div id="stat-v" class="text-xl font-bold text-indigo-400">6</div>
                        </div>
                        <div class="bg-slate-900/60 border border-slate-700/80 p-3 rounded-xl">
                            <div class="text-xs text-slate-400 mb-1 font-medium">邊數</div>
                            <div id="stat-e" class="text-xl font-bold text-indigo-400">9</div>
                        </div>
                        <div class="bg-slate-900/60 border border-slate-700/80 p-3 rounded-xl">
                            <div class="text-xs text-slate-400 mb-1 font-medium">面數</div>
                            <div id="stat-f" class="text-xl font-bold text-indigo-400">5</div>
                        </div>
                    </div>

                    <div id="euler-container"
                        class="bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-4 flex items-center space-x-3">
                        <div
                            class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="text-xs text-emerald-200">
                            <span class="font-bold">歐拉公式驗證：</span> <span id="euler-text">$V - E + F = 6 - 9 + 5 =
                                2$</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 flex flex-col space-y-6">
                <div
                    class="bg-slate-800/60 backdrop-blur border border-slate-700/60 p-2 rounded-2xl flex flex-wrap items-center justify-between gap-4 shadow-xl">
                    <div class="flex space-x-2 w-full sm:w-auto">
                        <button onclick="switchViewMode('solid')" id="btn-mode-solid"
                            class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
                            <i class="fa-solid fa-cube"></i>
                            <span>立體圖</span>
                        </button>
                        <button onclick="switchViewMode('xray')" id="btn-mode-xray"
                            class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-700/50">
                            <i class="fa-solid fa-eye"></i>
                            <span>透視圖</span>
                        </button>
                        <button onclick="switchViewMode('net')" id="btn-mode-net"
                            class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-700/50">
                            <i class="fa-solid fa-map"></i>
                            <span>展開圖</span>
                        </button>
                    </div>

                    <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                        <span id="interaction-hint" class="text-xs text-slate-400 hidden sm:inline-block">
                            <i class="fa-solid fa-hand-pointer mr-1"></i> 可拖曳滑鼠旋轉模型
                        </span>
                        <button onclick="resetCamera()"
                            class="p-2.5 rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-300 hover:text-white transition-all text-sm flex items-center space-x-1.5 border border-slate-600/50 shadow-sm"
                            title="重置視角">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span class="text-xs sm:inline hidden">重置視角</span>
                        </button>
                    </div>
                </div>

                <div class="canvas-container flex-grow relative">
                    <div id="three-canvas-target" class="w-full h-full"></div>

                    <div id="net-control-overlay"
                        class="absolute bottom-4 left-4 right-4 bg-slate-900/80 backdrop-blur-md border border-slate-700/80 p-4 rounded-xl hidden items-center space-x-4 shadow-2xl">
                        <span class="text-xs font-medium text-indigo-300 whitespace-nowrap">展開動畫：</span>
                        <input type="range" id="net-progress-slider" min="0" max="100" value="0"
                            class="w-full accent-indigo-500 cursor-pointer">
                        <span id="net-progress-val" class="text-xs font-mono text-slate-300 w-10 text-right">0%</span>
                    </div>

                    <div
                        class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur border border-slate-700/80 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 flex items-center space-x-2 shadow-lg">
                        <span id="mode-indicator-dot" class="w-2 h-2 rounded-full bg-indigo-400"></span>
                        <span id="mode-indicator-text">目前模式：立體圖</span>
                    </div>
                </div>

                <div
                    class="bg-slate-800/60 backdrop-blur border border-slate-700/60 p-6 rounded-2xl shadow-xl space-y-3">
                    <h4 class="text-sm font-bold text-indigo-400 flex items-center space-x-2">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>幾何小知識與觀察重點</span>
                    </h4>
                    <p id="educational-tip" class="text-sm text-slate-300 leading-relaxed">
                        柱體的特色在於上下底面完全相同且平行。透過「透視圖」模式，您可以清楚觀察到柱體的內部高度與頂點支撐架構；透過「展開圖」模式，則能了解側面的長方形是如何完美包覆上下兩個底面。
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>立體幾合教育互動平台 &copy; 2026 | 支援 3D 互動旋轉、透視與動態展開</p>
    </footer> -->

    <script>
        // ============================================================
        //  資料結構
        // ============================================================
        const shapesData = {
            prism: [
                { id: 'triangular_prism', name: '三角柱', v: 6, e: 9, f: 5, desc: '上下底面為全等的三角形，側面為三個長方形組成。', tip: '三角柱具有 6 個頂點、9 條邊與 5 個面。其側面展開後為一個大長方形。' },
                { id: 'square_prism', name: '四角柱 (長方體)', v: 8, e: 12, f: 6, desc: '上下底面為全等的四邊形（此處以正方形為例），側面為四個長方形。', tip: '四角柱最常見的例子就是長方體或正方體，擁有 8 個頂點、12 條邊與 6 個面。' },
                { id: 'pentagonal_prism', name: '五角柱', v: 10, e: 15, f: 7, desc: '上下底面為全等的五邊形，側面由五個長方形環繞而成。', tip: '五角柱的底面是五邊形，共有 10 個頂點、15 條邊與 7 個面。展開圖中央為五邊形底面，周圍環繞五個長方形側面。' },
                { id: 'cylinder', name: '圓柱', v: 0, e: 2, f: 3, desc: '上下底面為全等的圓形，側面為一個曲面（展開後為長方形）。', tip: '圓柱展開圖的長方形寬度等於底面圓周長 (2πr)，高度等於柱高。上下兩個圓形分別與長方形的上下邊相切。' }
            ],
            pyramid: [
                { id: 'triangular_pyramid', name: '三角錐 (四面體)', v: 4, e: 6, f: 4, desc: '底面為三角形，側面由三個三角形匯聚於頂點。', tip: '三角錐（又稱四面體）是邊數最少的錐體，展開圖由中央底面三角形與三個側面三角形組成。' },
                { id: 'square_pyramid', name: '四角錐', v: 5, e: 8, f: 5, desc: '底面為正方形，側面由四個三角形匯聚於頂點。', tip: '埃及金字塔即為典型四角錐，展開圖由中央正方形與四個外翻的等腰三角形組成。' },
                { id: 'pentagonal_pyramid', name: '五角錐', v: 6, e: 10, f: 6, desc: '底面為五邊形，側面由五個三角形匯聚於頂點。', tip: '五角錐展開圖為中央五邊形底面，外圍環繞五個三角形側面。' },
                { id: 'cone', name: '圓錐', v: 1, e: 1, f: 2, desc: '底面為圓形，側面為扇形曲面匯聚於錐頂。圓錐沒有像正方體那樣「一條一條的直線邊」，但是它有一條曲線形成的邊。', tip: '圓錐展開圖由一個扇形（側面）與一個圓形（底面）組成。扇形半徑等於母線長(頂點到圓周的斜線距離)，弧長等於底面圓周長。' }
            ]
        };

        // ============================================================
        //  狀態
        // ============================================================
        let currentCategory = 'prism';
        let currentShapeId = 'triangular_prism';
        let currentViewMode = 'solid';
        let netProgress = 0;

        let scene, camera, renderer;
        let modelContainerGroup;
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };

        // ============================================================
        //  初始化
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            renderShapeButtons();
            updateShapeInfo();
            rebuildModel();

            window.addEventListener('resize', onWindowResize);

            const slider = document.getElementById('net-progress-slider');
            slider.addEventListener('input', (e) => {
                netProgress = parseInt(e.target.value);
                document.getElementById('net-progress-val').innerText = netProgress + '%';
                updateNetAnimation();
            });
        });

        function switchCategory(category) {
            currentCategory = category;
            const prismBtn = document.getElementById('tab-prism');
            const pyramidBtn = document.getElementById('tab-pyramid');

            if (category === 'prism') {
                prismBtn.className = "flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
                pyramidBtn.className = "flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-700/50";
                currentShapeId = 'triangular_prism';
            } else {
                pyramidBtn.className = "flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
                prismBtn.className = "flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-700/50";
                currentShapeId = 'triangular_pyramid';
            }

            renderShapeButtons();
            updateShapeInfo();
            rebuildModel();
        }

        function renderShapeButtons() {
            const grid = document.getElementById('shape-buttons-grid');
            grid.innerHTML = '';
            const shapes = shapesData[currentCategory];

            shapes.forEach(shape => {
                const btn = document.createElement('button');
                const isSelected = shape.id === currentShapeId;
                btn.className = `p-3 rounded-xl text-left transition-all duration-200 border flex items-center ${isSelected
                    ? 'bg-indigo-600/20 border-indigo-500 text-indigo-300 shadow-lg shadow-indigo-500/10'
                    : 'bg-slate-900/40 border-slate-700/70 text-slate-300 hover:bg-slate-700/40 hover:border-slate-600'
                    }`;
                btn.innerHTML = `
                    <div class="font-bold text-sm">${shape.name}</div>
                `;
                btn.onclick = () => {
                    currentShapeId = shape.id;
                    renderShapeButtons();
                    updateShapeInfo();
                    rebuildModel();
                };
                grid.appendChild(btn);
            });
        }

        function updateShapeInfo() {
            const shape = shapesData[currentCategory].find(s => s.id === currentShapeId);
            document.getElementById('current-shape-title').innerText = shape.name;
            document.getElementById('shape-category-badge').innerText = currentCategory === 'prism' ? '柱體' : '錐體';
            document.getElementById('current-shape-desc').innerText = shape.desc;
            document.getElementById('educational-tip').innerText = shape.tip;

            document.getElementById('stat-v').innerText = shape.v;
            document.getElementById('stat-e').innerText = shape.e;
            document.getElementById('stat-f').innerText = shape.f;

            const eulerContainer = document.getElementById('euler-container');
            const eulerText = document.getElementById('euler-text');

            if (shape.v > 0) {
                eulerContainer.style.display = 'flex';
                const calc = shape.v - shape.e + shape.f;
                eulerText.innerHTML = `V - E + F = ${shape.v} - ${shape.e} + ${shape.f} = ${calc} (成立)`;
            } else {
                eulerContainer.style.display = 'none';
            }
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            const btnSolid = document.getElementById('btn-mode-solid');
            const btnXray = document.getElementById('btn-mode-xray');
            const btnNet = document.getElementById('btn-mode-net');
            const netOverlay = document.getElementById('net-control-overlay');
            const indDot = document.getElementById('mode-indicator-dot');
            const indText = document.getElementById('mode-indicator-text');

            [btnSolid, btnXray, btnNet].forEach(b => {
                b.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-700/50";
            });

            if (mode === 'solid') {
                btnSolid.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
                netOverlay.style.display = 'none';
                indDot.className = "w-2 h-2 rounded-full bg-indigo-400";
                indText.innerText = "目前模式：立體圖";
            } else if (mode === 'xray') {
                btnXray.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
                netOverlay.style.display = 'none';
                indDot.className = "w-2 h-2 rounded-full bg-cyan-400 animate-pulse";
                indText.innerText = "目前模式：透視圖 (X光)";
            } else if (mode === 'net') {
                btnNet.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
                netOverlay.style.display = 'flex';
                indDot.className = "w-2 h-2 rounded-full bg-amber-400";
                indText.innerText = "目前模式：展開圖展示";
            }

            rebuildModel();
        }

        // ============================================================
        //  Three.js 初始化
        // ============================================================
        function initThreeJS() {
            const container = document.getElementById('three-canvas-target');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const backLight = new THREE.DirectionalLight(0x818cf8, 0.4);
            backLight.position.set(-5, -5, -5);
            scene.add(backLight);

            modelContainerGroup = new THREE.Group();
            scene.add(modelContainerGroup);

            container.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                modelContainerGroup.rotation.y += deltaX * 0.01;
                modelContainerGroup.rotation.x += deltaY * 0.01;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => {
                isMouseDown = false;
            });

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isMouseDown = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (!isMouseDown || e.touches.length !== 1) return;
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;

                modelContainerGroup.rotation.y += deltaX * 0.01;
                modelContainerGroup.rotation.x += deltaY * 0.01;

                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            window.addEventListener('touchend', () => {
                isMouseDown = false;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('three-canvas-target');
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function resetCamera() {
            if (!modelContainerGroup) return;
            modelContainerGroup.rotation.set(0, 0, 0);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 0, 0);
            netProgress = 0;
            document.getElementById('net-progress-slider').value = 0;
            document.getElementById('net-progress-val').innerText = '0%';
            rebuildModel();
        }

        // ============================================================
        //  模型重建
        // ============================================================
        function rebuildModel() {
            if (!modelContainerGroup) return;
            while (modelContainerGroup.children.length > 0) {
                modelContainerGroup.remove(modelContainerGroup.children[0]);
            }

            modelContainerGroup.rotation.set(0, 0, 0);

            if (currentViewMode === 'net') {
                buildNetModel(currentShapeId, netProgress / 100);
            } else {
                buildSolidOrXrayModel(currentShapeId, currentViewMode === 'xray');
            }
        }

        function updateNetAnimation() {
            if (currentViewMode === 'net') rebuildModel();
        }

        function getMaterial(isXray, color = 0x6366f1) {
            if (isXray) {
                return new THREE.MeshPhysicalMaterial({
                    color: color, transparent: true, opacity: 0.35,
                    roughness: 0.1, metalness: 0.1,
                    side: THREE.DoubleSide, depthWrite: false
                });
            }
            return new THREE.MeshStandardMaterial({
                color: color, roughness: 0.3, metalness: 0.2, side: THREE.DoubleSide
            });
        }

        // ============================================================
        //  立體 / 透視模式
        // ============================================================
        function buildSolidOrXrayModel(shapeId, isXray) {
            const group = new THREE.Group();
            const matColor = 0x6366f1;
            const edgeColor = isXray ? 0x93c5fd : 0x312e81;

            if (shapeId === 'triangular_prism') {
                const height = 2.5, radius = 1.5;
                const geom = new THREE.CylinderGeometry(radius, radius, height, 3);
                geom.rotateY(Math.PI / 6);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, matColor)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: edgeColor })));
                if (isXray) addHeightIndicator(group, height);
            } else if (shapeId === 'square_prism') {
                const width = 2, height = 2.5, depth = 2;
                const geom = new THREE.BoxGeometry(width, height, depth);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, matColor)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: edgeColor })));
            } else if (shapeId === 'pentagonal_prism') {
                const height = 2.5, radius = 1.5;
                const geom = new THREE.CylinderGeometry(radius, radius, height, 5);
                geom.rotateY(Math.PI / 10);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, matColor)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: edgeColor })));
            } else if (shapeId === 'cylinder') {
                const height = 2.5, radius = 1.3;
                const geom = new THREE.CylinderGeometry(radius, radius, height, 32);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, matColor)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: edgeColor })));
            } else if (shapeId === 'triangular_pyramid') {
                const radius = 1.6, height = 2.5;
                const geom = new THREE.ConeGeometry(radius, height, 3);
                geom.rotateY(Math.PI / 6);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, 0x8b5cf6)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: isXray ? 0xc4b5fd : 0x4c1d95 })));
            } else if (shapeId === 'square_pyramid') {
                const radius = 1.8, height = 2.5;
                const geom = new THREE.ConeGeometry(radius, height, 4);
                geom.rotateY(Math.PI / 4);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, 0x8b5cf6)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: isXray ? 0xc4b5fd : 0x4c1d95 })));
            } else if (shapeId === 'pentagonal_pyramid') {
                const radius = 1.7, height = 2.5;
                const geom = new THREE.ConeGeometry(radius, height, 5);
                geom.rotateY(Math.PI / 10);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, 0x8b5cf6)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: isXray ? 0xc4b5fd : 0x4c1d95 })));
            } else if (shapeId === 'cone') {
                const radius = 1.4, height = 2.5;
                const geom = new THREE.ConeGeometry(radius, height, 32);
                group.add(new THREE.Mesh(geom, getMaterial(isXray, 0x8b5cf6)));
                group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: isXray ? 0xc4b5fd : 0x4c1d95 })));
            }

            modelContainerGroup.add(group);
        }

        function addHeightIndicator(group, height) {
            const material = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: 0.1, gapSize: 0.05 });
            const points = [new THREE.Vector3(0, -height / 2, 0), new THREE.Vector3(0, height / 2, 0)];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, material);
            line.computeLineDistances();
            group.add(line);
        }

        // ============================================================
        //  ★ 展開圖建構（已修正）
        // ============================================================

        const NET_EDGE_COLOR = 0x818cf8;

        // ---- 通用工具 ----
        function polygonVerts(n, R, startAngle) {
            const arr = [];
            for (let i = 0; i < n; i++) {
                const a = startAngle + (i * 2 * Math.PI) / n;
                arr.push(new THREE.Vector3(R * Math.cos(a), R * Math.sin(a), 0));
            }
            return arr;
        }

        function makePolygonFace(verts, mat) {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for (let i = 1; i < verts.length - 1; i++) {
                pos.push(verts[0].x, verts[0].y, verts[0].z);
                pos.push(verts[i].x, verts[i].y, verts[i].z);
                pos.push(verts[i + 1].x, verts[i + 1].y, verts[i + 1].z);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, mat);
        }

        function makePolygonOutline(verts, lineMat) {
            const pts = verts.map(v => v.clone());
            pts.push(verts[0].clone());
            return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat);
        }

        // ---- 展開圖主入口 ----
        function buildNetModel(shapeId, progress) {
            const group = new THREE.Group();
            const prismColor = 0x6366f1;
            const pyramidColor = 0x8b5cf6;

            switch (shapeId) {
                case 'triangular_prism':
                    group.add(buildPrismNet(3, 1.1, 1.9, progress, prismColor));
                    break;
                case 'square_prism':
                    group.add(buildPrismNet(4, 1.1, 1.9, progress, prismColor));
                    break;
                case 'pentagonal_prism':
                    group.add(buildPrismNet(5, 1.1, 1.9, progress, prismColor));
                    break;
                case 'cylinder':
                    group.add(buildCylinderNet(0.75, 1.7, progress, prismColor));
                    break;
                case 'triangular_pyramid':
                    group.add(buildPyramidNet(3, 1.3, 2.0, progress, pyramidColor));
                    break;
                case 'square_pyramid':
                    group.add(buildPyramidNet(4, 1.3, 2.0, progress, pyramidColor));
                    break;
                case 'pentagonal_pyramid':
                    group.add(buildPyramidNet(5, 1.3, 2.0, progress, pyramidColor));
                    break;
                case 'cone':
                    group.add(buildConeNet(0.85, 1.9, progress, pyramidColor));
                    break;
                default:
                    buildSolidOrXrayModel(shapeId, false);
                    return;
            }

            modelContainerGroup.add(group);
        }

        // ============================================================
        //  1) 錐體展開圖（三角錐 / 四角錐 / 五角錐）
        //     底面多邊形固定於中央，側面三角形沿底邊向外翻折
        // ============================================================
        function buildPyramidNet(n, baseR, height, progress, color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15, side: THREE.DoubleSide });
            const lineMat = new THREE.LineBasicMaterial({ color: NET_EDGE_COLOR });

            const verts = polygonVerts(n, baseR, -Math.PI / 2);
            const apothem = baseR * Math.cos(Math.PI / n);
            const slantH = Math.sqrt(apothem * apothem + height * height);

            // 底面
            group.add(makePolygonFace(verts, mat));
            group.add(makePolygonOutline(verts, lineMat));

            // 側面折疊角
            // 平放時頂點位於 (0, slantH, 0)（相對底邊中點）
            // 摺起時頂點位於 (0, -apothem, height)
            // 繞底邊（x 軸）旋轉角 β：
            //   slantH·cosβ = -apothem ， slantH·sinβ = height
            //   => β = atan2(-height, -apothem)（負角，確保往內上方摺）
            const betaMax = Math.atan2(-height, -apothem);
            const angle = (1 - progress) * betaMax;

            for (let i = 0; i < n; i++) {
                const p1 = verts[i];
                const p2 = verts[(i + 1) % n];
                const mid = p1.clone().add(p2).multiplyScalar(0.5);
                const edgeDir = p2.clone().sub(p1).normalize();
                const outward = mid.clone().normalize();
                const apex = mid.clone().add(outward.clone().multiplyScalar(slantH));

                // 三角形面
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute([
                    p1.x, p1.y, p1.z,
                    p2.x, p2.y, p2.z,
                    apex.x, apex.y, apex.z
                ], 3));
                geo.computeVertexNormals();

                // 摺疊矩陣：繞通過 mid、方向為 edgeDir 的軸旋轉 angle
                const toOrigin = new THREE.Matrix4().makeTranslation(-mid.x, -mid.y, -mid.z);
                const rot = new THREE.Matrix4().makeRotationAxis(edgeDir, angle);
                const back = new THREE.Matrix4().makeTranslation(mid.x, mid.y, mid.z);
                const hinge = new THREE.Matrix4().multiplyMatrices(back, new THREE.Matrix4().multiplyMatrices(rot, toOrigin));

                geo.applyMatrix4(hinge);
                group.add(new THREE.Mesh(geo, mat));

                // 輪廓線
                const lg = new THREE.BufferGeometry().setFromPoints([
                    p1.clone(), p2.clone(), apex.clone(), p1.clone()
                ]);
                lg.applyMatrix4(hinge);
                group.add(new THREE.Line(lg, lineMat));
            }

            return group;
        }

        // ============================================================
        //  2) 柱體展開圖（三角柱 / 四角柱 / 五角柱）
        //     底面多邊形固定於中央，側面長方形沿底邊向外翻折成筒狀
        //     頂面多邊形接在其中一個長方形的遠端邊上
        // ============================================================
        function buildPrismNet(n, baseR, prismH, progress, color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15, side: THREE.DoubleSide });
            const lineMat = new THREE.LineBasicMaterial({ color: NET_EDGE_COLOR });

            const verts = polygonVerts(n, baseR, -Math.PI / 2);
            const apothem = baseR * Math.cos(Math.PI / n);
            const sideLen = 2 * baseR * Math.sin(Math.PI / n);

            // 底面
            group.add(makePolygonFace(verts, mat));
            group.add(makePolygonOutline(verts, lineMat));

            // 側面摺疊角：0（平放）→ -π/2（立起）
            const beta = (1 - progress) * (-Math.PI / 2);

            for (let i = 0; i < n; i++) {
                const p1 = verts[i];
                const p2 = verts[(i + 1) % n];
                const mid = p1.clone().add(p2).multiplyScalar(0.5);
                const e1 = p2.clone().sub(p1).normalize();      // 沿底邊
                const e2 = mid.clone().normalize();              // 向外
                const e3 = new THREE.Vector3().crossVectors(e1, e2); // 垂直（指向下方）

                const basisMat = new THREE.Matrix4().makeBasis(e1, e2, e3);

                // 鉸鏈組
                const A = new THREE.Group();
                A.position.copy(mid);
                A.quaternion.setFromRotationMatrix(basisMat);

                // 摺疊旋轉組
                const A2 = new THREE.Group();
                A2.rotation.x = beta;
                A.add(A2);

                // --- 側面長方形（局部座標：x 沿邊，y 向外，z 垂直） ---
                const rectGeo = new THREE.PlaneGeometry(sideLen, prismH);
                const rectMesh = new THREE.Mesh(rectGeo, mat);
                rectMesh.position.set(0, prismH / 2, 0);
                A2.add(rectMesh);

                const rectPts = [
                    new THREE.Vector3(-sideLen / 2, 0, 0),
                    new THREE.Vector3(sideLen / 2, 0, 0),
                    new THREE.Vector3(sideLen / 2, prismH, 0),
                    new THREE.Vector3(-sideLen / 2, prismH, 0),
                    new THREE.Vector3(-sideLen / 2, 0, 0)
                ];
                A2.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rectPts), lineMat));

                // --- 頂面多邊形（僅掛在第一個側面上） ---
                if (i === 0) {
                    const B = new THREE.Group();
                    B.position.set(0, prismH, 0);
                    B.rotation.x = beta;   // 與側面同步再摺一次，確保摺起後呈水平
                    A2.add(B);

                    // 頂面多邊形：讓一條邊的中點落在 B 的原點，
                    // 多邊形中心位於 (0, apothem, 0)
                    const topVerts = [];
                    for (let k = 0; k < n; k++) {
                        const ang = -Math.PI / 2 + Math.PI / n + (k * 2 * Math.PI) / n;
                        topVerts.push(new THREE.Vector3(
                            baseR * Math.cos(ang),
                            apothem + baseR * Math.sin(ang),
                            0
                        ));
                    }
                    B.add(makePolygonFace(topVerts, mat));
                    B.add(makePolygonOutline(topVerts, lineMat));
                }

                group.add(A);
            }

            return group;
        }

        // ============================================================
        //  3) 圓柱展開圖
        //     中央長方形（寬 = 2πr，高 = h）＋ 上下兩個圓
        // ============================================================
        function buildCylinderNet(r, h, progress, color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15, side: THREE.DoubleSide });
            const lineMat = new THREE.LineBasicMaterial({ color: NET_EDGE_COLOR });

            const rectW = 2 * Math.PI * r;

            // 側面長方形
            const rectGeo = new THREE.PlaneGeometry(rectW, h);
            group.add(new THREE.Mesh(rectGeo, mat));

            const rectPts = [
                new THREE.Vector3(-rectW / 2, -h / 2, 0),
                new THREE.Vector3(rectW / 2, -h / 2, 0),
                new THREE.Vector3(rectW / 2, h / 2, 0),
                new THREE.Vector3(-rectW / 2, h / 2, 0),
                new THREE.Vector3(-rectW / 2, -h / 2, 0)
            ];
            group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rectPts), lineMat));

            // 上下兩個圓（展開動畫：從貼齊邊緣滑出至相切位置）
            const circGeo = new THREE.CircleGeometry(r, 64);
            const circleOutlinePts = [];
            for (let i = 0; i <= 64; i++) {
                const a = (i / 64) * Math.PI * 2;
                circleOutlinePts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
            }

            const slideDist = r * progress;   // 0 → r
            const yTop = h / 2 + slideDist;
            const yBot = -h / 2 - slideDist;

            const topCircle = new THREE.Mesh(circGeo, mat);
            topCircle.position.set(0, yTop, 0);
            group.add(topCircle);

            const botCircle = new THREE.Mesh(circGeo, mat);
            botCircle.position.set(0, yBot, 0);
            group.add(botCircle);

            const topLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(circleOutlinePts), lineMat);
            topLine.position.copy(topCircle.position);
            group.add(topLine);

            const botLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(circleOutlinePts), lineMat);
            botLine.position.copy(botCircle.position);
            group.add(botLine);

            return group;
        }

        // ============================================================
        //  4) 圓錐展開圖
        //     側面為扇形（半徑 = 母線長，圓心角 = 2πr / 母線）
        //     底面為圓形
        // ============================================================
        function buildConeNet(r, h, progress, color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15, side: THREE.DoubleSide });
            const lineMat = new THREE.LineBasicMaterial({ color: NET_EDGE_COLOR });

            const slantL = Math.sqrt(r * r + h * h);
            const sectorAngle = (2 * Math.PI * r) / slantL;   // 展開扇形圓心角

            // 扇形：頂點在原點，朝上展開（以 +Y 為對稱軸）
            const startAngle = Math.PI / 2 - sectorAngle / 2;
            const sectorGeo = new THREE.CircleGeometry(slantL, 96, startAngle, sectorAngle);
            group.add(new THREE.Mesh(sectorGeo, mat));

            // 扇形輪廓：頂點 → 弧 → 頂點
            const sectorPts = [new THREE.Vector3(0, 0, 0)];
            for (let i = 0; i <= 96; i++) {
                const a = startAngle + (i / 96) * sectorAngle;
                sectorPts.push(new THREE.Vector3(slantL * Math.cos(a), slantL * Math.sin(a), 0));
            }
            sectorPts.push(new THREE.Vector3(0, 0, 0));
            group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(sectorPts), lineMat));

            // 底面圓（展開時往下滑出）
            const circGeo = new THREE.CircleGeometry(r, 64);
            const circleOutlinePts = [];
            for (let i = 0; i <= 64; i++) {
                const a = (i / 64) * Math.PI * 2;
                circleOutlinePts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
            }

            const dropDist = (r + 0.25) * progress;
            const circleY = -dropDist;

            const baseCircle = new THREE.Mesh(circGeo, mat);
            baseCircle.position.set(0, circleY, 0);
            group.add(baseCircle);

            const baseLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(circleOutlinePts), lineMat);
            baseLine.position.copy(baseCircle.position);
            group.add(baseLine);

            return group;
        }
    </script>
